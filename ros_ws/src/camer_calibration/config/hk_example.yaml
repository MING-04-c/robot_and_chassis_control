# 以下为示例，不代表实际设备。运行前必须测量并修改棋盘格参数。
camera_model_label: CS050  # 用户提供的简称，完整型号待确认
focus_state: fixed        # 用户确认固定对焦
image_dir: ../photos
output_dir: ../results
# 可选：另外拍摄且未用于拟合的棋盘格照片；不需要时设置为 null。
validation_dir: null
board_cols: 9  # 每行内角点数，即列数；对应 10 列方格
board_rows: 6  # 每列内角点数，即行数；对应 7 行方格
square_size_mm: 20.0
min_views: 10
# null 使用数据分布自动提示偏高误差；不是标定合格阈值。
error_warning_px: null
# 0 保留较少黑边，1 保留更多视野；输出不裁剪，尺寸与原图一致。
undistort_alpha: 1.0
