sensor_node:
  ros__parameters:
    transport: tcp
    # 485 转网口设备应配置为 TCP Server，本节点作为 TCP Client 主动连接。
    host: 169.254.199.80
    port: 9001
    reconnect_period_ms: 1000
    tcp_keepalive: true
    tcp_no_delay: true
    auto_start: true
    zero_before_request: true
    request_period: 0.0
    command_delay_ms: 300
    zero_wait_ms: 1000
    unit_switch_delay_ms: 300
    # 停止采集 01 与退出 debug 31 之间等待 1 秒，避免设备漏收停止命令。
    stop_exit_delay_ms: 1000
    # 自动识别时忽略 unit 声明；仅 auto_calibrate_unit=false 时使用人工单位。
    unit: "N"
    auto_calibrate_unit: true
    target_unit: "N"  # 识别后硬件停留档位：N、kgf 或 keep；ROS 输出始终为 N/N·m
    unit_calibration_samples: 100
    unit_calibration_zero_each_group: true  # 实验：每组采样前清零，含目标单位复核组
    unit_calibration_timeout: 5.0       # 每组采样最长等待，秒
    unit_calibration_min_force: 0.05    # 单轴或三轴绝对值合计的最小幅值，避免近零比值
    unit_calibration_ratio_tolerance: 0.2  # 相对 9.80665 的允许偏差 20%
    unit_calibration_max_noise: 0.1     # 单轴相对波动上限；近零/高噪声轴不提供单位证据
    baud_code: 0
    publish_wrench: true
    data_format: float32_be
    data_offset: 3
    frame_size: 29
    # 这里必须是传感器自身坐标系，不能在轴向不一致时冒充 tool0。
    frame_id: force_sensor
    raw_topic: /sensor/rx_bytes
    raw_rx_topic: /sensor/raw_rx_bytes
    raw_rx_hex_topic: /sensor/raw_rx
    hex_topic: /sensor/rx
    wrench_topic: /sensor/wrench
