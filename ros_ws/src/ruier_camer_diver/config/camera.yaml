/**:
  ros__parameters:
    video_device: "/dev/video0"
    pixel_format: "MJPG"     # MJPG / YUYV / UYVY
    image_width: 640
    image_height: 480
    framerate: 15            # 整数；最终帧率由摄像头协商决定
    frame_id: "camera_optical_frame"
    camera_name: "usb_camera"
    camera_info_url: ""     # 空：默认路径存在时加载，否则明确发布未标定信息；仅填写本USB相机实测YAML
    publish_raw: true       # 发布 bgr8；仅需 MJPEG 压缩帧时设为 false
    publish_compressed: true
    jpeg_quality: 85        # 只影响 YUYV/UYVY 转 JPEG，MJPG 原样传输
