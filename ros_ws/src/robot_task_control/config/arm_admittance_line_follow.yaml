# 导纳以步骤开始时的当前 TCP 为目标，无预设位移；完成后保持柔顺。
# 循迹累计有效 tracking 2 秒后停车；可修改 seconds 和 step_timeout_sec。
workflow:
  name: arm_admittance_line_follow
  auto_start: false
  steps:
  - action: arm_move
    control_mode: admittance
    frame_id: base_link
    end_effector_frame: tool0
    max_position_distance: 0.01
    arrival_tolerance: 0.005
    after_arrival_delay_sec: 2.0
    motion_timeout_sec: 60.0
    progress_timeout_sec: 10.0
    target_pose:
      position_mode: relative
      position:
      - 0.0
      - 0.0
      - 0.0
      orientation: current
  - action: line_follow
    seconds: 2.0
    progress_timeout_sec: 3.0
    step_timeout_sec: 30.0
