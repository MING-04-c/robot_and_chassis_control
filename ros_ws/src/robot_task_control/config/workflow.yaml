workflow:
  name: line_follow_arm_hk_capture
  auto_start: false
  task_table: chassis_tasks.yaml

  # 联合测试：AGV 前进、左移、后退，然后机械臂沿基座 +Y 移动 5 cm。
  # 每个底盘任务本机控制器报告 completed 后才继续下一步。
  steps:
    # USB 摄像头循迹 2 秒（累计实际 tracking 时间），然后停稳并交还 PID。
    - action: line_follow
      seconds: 2.0
      progress_timeout_sec: 3.0

    - action: chassis_execute
      task: forward_10cm
    - action: wait_chassis
      task: forward_10cm

    - action: delay
      seconds: 1.0

    - action: chassis_execute
      task: left_10cm
    - action: wait_chassis
      task: left_10cm

    - action: delay
      seconds: 1.0

    - action: chassis_execute
      task: backward_10cm
    - action: wait_chassis
      task: backward_10cm

    - action: delay
      seconds: 2.0

    # 直接由导纳控制器使用 MoveIt IK 驱动至目标，到位后继续柔顺保持。
    - action: arm_move
      control_mode: admittance
      frame_id: base_link
      end_effector_frame: tool0
      max_position_distance: 0.06
      # The admittance controller keeps regulating after this workflow step finishes.
      arrival_tolerance: 0.005
      # 到位后继续保持导纳 2 秒，再执行下面的工作流步骤。
      after_arrival_delay_sec: 2.0
      motion_timeout_sec: 60.0
      progress_timeout_sec: 10.0
      target_pose:
        # 本步骤开始时的当前末端位置，沿 base_link +Y 偏移 5 cm。
        position_mode: relative
        position: [0.0, 0.05, 0.0]
        orientation: current

    # HK 在机械臂到位时触发单次拍照，等待该次新照片保存成功。
    # 每张成功保存的照片由原 MIMG 图像链路通过网线发送给外部主机。
    - action: hk_capture
      step_timeout_sec: 30.0
