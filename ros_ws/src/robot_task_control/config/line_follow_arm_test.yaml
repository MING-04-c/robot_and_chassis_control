# 站点动作共用下方YAML锚点。途中站等待下一次开始，最终站完成即结束。
# 关节行驶/中转姿态统一修改 eli_cs_robot_moveit_config/config/arm_joint_postures.yaml。
# 笛卡尔XYZ为base_link米，RPY为度；本测试不启动HK、深度相机和TCP发送。
workflow:
  name: line_follow_arm_station_test
  auto_start: true
  arm_postures_before_chassis: true
  station_steps: &station_actions
  - &wait_stopped
    action: wait_chassis_stopped
    stable_seconds: 1.0
    linear_tolerance: 0.005
    angular_tolerance: 0.02
    data_timeout_sec: 0.5
    step_timeout_sec: 10.0
  - action: arm_posture
    posture: detection_ready
    step_timeout_sec: 600.0
  - action: arm_move
    control_mode: moveit
    frame_id: base_link
    end_effector_frame: tool0
    max_position_distance: 1.0
    arrival_tolerance: 0.005
    skip_if_at_target: true
    arrival_orientation_tolerance_deg: 1.0
    after_arrival_delay_sec: 1.0
    step_timeout_sec: 120.0
    target_pose:
      position_mode: absolute
      position: [-0.05, 0.2, 0.475]
      orientation: [0.0, 0.0, 90.0]
  - action: arm_move
    control_mode: moveit
    frame_id: base_link
    end_effector_frame: tool0
    max_position_distance: 0.6
    arrival_tolerance: 0.005
    after_arrival_delay_sec: 1.0
    step_timeout_sec: 120.0
    target_pose:
      position_mode: absolute
      position: [-0.13, 0.35, 0.8]
      orientation: [0.0, 0.0, 90.0]
  - action: arm_move
    control_mode: moveit
    frame_id: base_link
    end_effector_frame: tool0
    max_position_distance: 0.6
    arrival_tolerance: 0.005
    after_arrival_delay_sec: 1.0
    step_timeout_sec: 120.0
    target_pose:
      position_mode: absolute
      position: [0.3, 0.165, 0.8]
      orientation: [0.0, 0.0, 0.0]
  - action: arm_move
    control_mode: moveit
    frame_id: base_link
    end_effector_frame: tool0
    max_position_distance: 0.6
    arrival_tolerance: 0.005
    after_arrival_delay_sec: 1.0
    step_timeout_sec: 120.0
    target_pose:
      position_mode: absolute
      position: [0.3, 0.2, 0.6]
      orientation: [-160.0, 0.0, -77.0]
  - action: arm_posture
    posture: detection_ready
    step_timeout_sec: 600.0
  steps:
  - *wait_stopped
  - action: line_follow
    drive_direction: forward
    service_intermediate_stations: true
    until_untrusted: true
    require_final_marker: true
    boundary_wait_sec: 5.0
    progress_timeout_sec: 5.0
    step_timeout_sec: 300.0
  - *station_actions
